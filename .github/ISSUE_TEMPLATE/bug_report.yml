name: Bug report
description: Something in the kit does not behave as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: input
    id: kit_version
    attributes:
      label: Kit version
      placeholder: 0.2.0
    validations:
      required: true
  - type: input
    id: php_version
    attributes:
      label: PHP version
      placeholder: "8.3"
    validations:
      required: true
  - type: input
    id: ps_version
    attributes:
      label: PrestaShop version
      placeholder: 9.2.1
  - type: textarea
    id: logs
    attributes:
      label: Error output or logs
      render: text
